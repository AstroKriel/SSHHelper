[project]
name = "ssh_helper"
version = "0.1.0"
description = "ssh_helper: a CLI tool for SSH key setup"
readme = "README.md"
authors = [{ name = "Neco Kriel", email = "necokriel@gmail.com" }]
requires-python = ">=3.12,<3.14"
dependencies = [
    "huginn",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
sources = ["src"]

[project.scripts]
ssh_helper = "ssh_helper.user_interface:main"

[tool.uv.sources]
huginn = { git = "https://github.com/AstroKriel/TerminalInterface.git", rev = "e9b10d5617022056075562dc76e07b3fb2d1ac30" }

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["utests"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "basedpyright>=1.0",
]

[tool.basedpyright]
include = ["src", "utests"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"
reportMissingImports = true
reportMissingTypeStubs = false
reportExplicitAny = "none"
reportAny = "none"
reportImplicitStringConcatenation = "none"
reportImplicitOverride = "none"
reportUnusedCallResult = "none"
